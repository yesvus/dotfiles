[main]
font=JetBrainsMono Nerd Font Mono:weight=bold:pixelsize=14, Symbols Nerd Font Mono:pixelsize=14
font-bold=JetBrainsMono Nerd Font Mono:weight=extrabold:pixelsize=14, Symbols Nerd Font Mono:pixelsize=14
font-size-adjustment=2px
line-height=18px
pad=8x8center
bold-text-in-bright=palette-based

# Active palette. Swap with: foot-theme <name>   (see ~/.config/foot/themes/)
include=~/.config/foot/theme.ini

[bell]
system=no

[cursor]
style=beam
blink=yes

[url]
# Default is xdg-open ${url}; pin it to Firefox explicitly.
launch=firefox ${url}
# Default trigger: Control+Shift+o enters URL mode (every visible URL gets
# a letter label; typing it opens that one in the launch command above).

# File-path matches (with an optional trailing :line or :line:col, e.g.
# "src/foo.py:10:3") -- same label-mode mechanic as [url], but opens in
# neovim via the wrapper script, which strips the :line:col suffix into
# nvim's "+LINE file" so the cursor lands there.
[regex:path]
regex=([~./]?[A-Za-z0-9_.-]*[/.][A-Za-z0-9_./-]*(:[0-9]+(:[0-9]+)?)?)
launch=/home/yesvus/.local/bin/foot-open-path ${match}

[key-bindings]
regex-launch=[path] Control+Shift+f
