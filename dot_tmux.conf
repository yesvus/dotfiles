# --- One Dark themed tmux config, shared across all machines ---

# Correct terminal type so apps (readline, vim) detect capabilities properly
set -g default-terminal "tmux-256color"

# Advertise true-color (24-bit) support so colors/themes render correctly
set -ga terminal-overrides ",*256col*:Tc"

# Let inner programs send OSC sequences (palette changes, clipboard) through to
# the real terminal. Required for ~/.config/shell/onedark-term.sh to theme the
# client's terminal from inside a tmux session.
set -g allow-passthrough on

# Re-push the One Dark palette whenever a client attaches. Shell startup files
# only fire for *new* shells, so re-attaching to a long-lived session from a
# different machine would otherwise keep that client's own colors. run-shell -b
# keeps this off the attach path so a slow client never blocks the server.
set-hook -g client-attached 'run-shell -b "ONEDARK_LIB_ONLY=1 . $HOME/.config/shell/onedark-term.sh 2>/dev/null; onedark_tmux_client_repaint 2>/dev/null"'

# Let cursor-shape escape sequences (DECSCUSR) pass through to the real terminal,
# so tmux can both apply and restore blinking-beam / steady-block correctly.
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# Alacritty needs an explicit terminal-features hint for cursor-style passthrough.
set -s terminal-features[3] 'alacritty*:cstyle'

# Force the pane cursor to a blinking bar regardless of what any app leaves behind
set -g cursor-style blinking-bar

# --- One Dark status bar ---
set -g status-style "bg=#282c34,fg=#abb2bf"
set -g status-left "#[fg=#61afef,bold] #S #[default]"
set -g status-right "#[fg=#56b6c2] %H:%M #[default]"
set -g window-status-current-style "bg=#3e4451,fg=#61afef,bold"
set -g pane-border-style "fg=#545862"
set -g pane-active-border-style "fg=#61afef"
